name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30

      - name: Flake check
        run: nix flake check --no-build

      - name: Check templates
        run: |
          for t in templates/*/; do
            t="${t%/}"
            echo "--- ${t##*/} ---"
            nix flake check --no-build "path:./$t" --override-input nixy path:.
          done

      - name: Run tests
        run: nix eval --file tests/eval.nix
